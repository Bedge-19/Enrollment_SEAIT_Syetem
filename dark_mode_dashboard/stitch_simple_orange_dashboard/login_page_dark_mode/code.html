<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Modern Minimalism</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#ff8c00",
                        "on-secondary-container": "#00374d",
                        "on-tertiary": "#472a00",
                        "on-tertiary-fixed-variant": "#653e00",
                        "secondary-container": "#00a6e0",
                        "surface-bright": "#2c3a4c",
                        "inverse-surface": "#d4e4fa",
                        "on-primary-container": "#623200",
                        "on-secondary": "#00354a",
                        "primary-fixed-dim": "#ffb77d",
                        "inverse-primary": "#904d00",
                        "surface-tint": "#ffb77d",
                        "surface-container-low": "#0d1c2d",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#2a1700",
                        "on-primary-fixed-variant": "#6e3900",
                        "surface": "#051424",
                        "surface-container-high": "#1c2b3c",
                        "on-background": "#d4e4fa",
                        "tertiary-container": "#ec9700",
                        "primary-fixed": "#ffdcc3",
                        "error-container": "#93000a",
                        "surface-dim": "#051424",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#273647",
                        "background": "#051424",
                        "secondary": "#94a3b8",
                        "tertiary": "#ffb95f",
                        "on-surface-variant": "#ddc1ae",
                        "inverse-on-surface": "#233143",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-container-lowest": "#010f1f",
                        "secondary-fixed": "#c4e7ff",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-fixed-variant": "#004c69",
                        "surface-variant": "#273647",
                        "outline-variant": "#564334",
                        "on-secondary-fixed": "#001e2c",
                        "on-surface": "#f8fafc",
                        "on-primary-fixed": "#2f1500",
                        "on-tertiary-container": "#5a3700",
                        "surface-container": "#122131",
                        "outline": "#334155",
                        "primary": "#ff8c00",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#7bd0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "xl": "80px",
                        "base": "8px",
                        "md": "24px",
                        "sm": "12px",
                        "lg": "48px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Work Sans"],
                        "label-sm": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "display-lg": ["Work Sans"],
                        "headline-lg": ["Work Sans"],
                        "headline-lg-mobile": ["Work Sans"],
                        "body-lg": ["Work Sans"],
                        "body-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#051424] min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased">
<div class="w-full max-w-md bg-surface-container rounded-lg shadow-[0px_8px_32px_rgba(0,0,0,0.45)] border border-surface-container-highest p-lg">
<!-- Header -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary rounded-lg flex items-center justify-center mb-sm shadow-[0px_4px_20px_rgba(255,140,0,0.35)]">
<span class="material-symbols-outlined text-white text-[32px]">bolt</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-white font-bold">Welcome Back</h1>
<p class="font-body-md text-body-md text-slate-400 mt-xs text-center">Enter your details to access your dashboard.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-slate-300" for="email">Email</label>
<input class="w-full h-12 px-sm py-sm bg-surface-container-low border border-surface-container-highest rounded-lg font-body-md text-body-md text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-slate-300" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-orange-400 transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full h-12 px-sm py-sm bg-surface-container-low border border-surface-container-highest rounded-lg font-body-md text-body-md text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full h-12 bg-primary hover:bg-[#e07b00] text-white font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center shadow-[0px_4px_20px_rgba(255,140,0,0.25)] font-semibold" type="submit">
                    Login
                </button>
</div>
</form>
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-slate-400">
                Don't have an account? <a class="text-primary font-label-md text-label-md hover:text-orange-400 transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
