<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Modern Minimalism</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#ff8c00",
                        "on-secondary-container": "#636262",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004c6c",
                        "secondary-container": "#e2dfde",
                        "surface-bright": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "on-primary-container": "#623200",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#ffb77d",
                        "inverse-primary": "#ffb77d",
                        "surface-tint": "#904d00",
                        "surface-container-low": "#f3f4f5",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#001e2e",
                        "on-primary-fixed-variant": "#6e3900",
                        "surface": "#f8f9fa",
                        "surface-container-high": "#e7e8e9",
                        "on-background": "#191c1d",
                        "tertiary-container": "#00b5fc",
                        "primary-fixed": "#ffdcc3",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadb",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e1e3e4",
                        "background": "#f8f9fa",
                        "secondary": "#5f5e5e",
                        "tertiary": "#00658f",
                        "on-surface-variant": "#564334",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary-fixed-dim": "#85cfff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary-fixed": "#c7e7ff",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-variant": "#e1e3e4",
                        "outline-variant": "#ddc1ae",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-surface": "#191c1d",
                        "on-primary-fixed": "#2f1500",
                        "on-tertiary-container": "#004360",
                        "surface-container": "#edeeef",
                        "outline": "#897362",
                        "primary": "#ff8c00", // Adjusted to vibrant orange based on style guide
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "xl": "80px",
                        "base": "8px",
                        "md": "24px",
                        "sm": "12px",
                        "lg": "48px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Work Sans"],
                        "label-sm": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "display-lg": ["Work Sans"],
                        "headline-lg": ["Work Sans"],
                        "headline-lg-mobile": ["Work Sans"],
                        "body-lg": ["Work Sans"],
                        "body-md": ["Work Sans"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased">
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-surface-container-highest p-lg">
<!-- Header -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary rounded-lg flex items-center justify-center mb-sm shadow-[0px_4px_20px_rgba(255,140,0,0.2)]">
<span class="material-symbols-outlined text-on-primary text-[32px]">bolt</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h1>
<p class="font-body-md text-body-md text-secondary mt-xs text-center">Enter your details to access your dashboard.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full h-12 px-sm py-sm bg-surface-bright border border-surface-container-highest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full h-12 px-sm py-sm bg-surface-bright border border-surface-container-highest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center shadow-[0px_4px_20px_rgba(255,140,0,0.1)]" type="submit">
                    Login
                </button>
</div>
</form>
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-secondary">
                Don't have an account? <a class="text-primary font-label-md text-label-md hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
